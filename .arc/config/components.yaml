version: 2
components:
  comp_web_app:
    name: Web App
    repo_ref: conn-github-32ebad80c69641869af2467b473acbcb
    kind: web_ui
    directory: apps/web
    integrations:
    - to: comp_records_api
      interaction: sync
      via: http
      contract:
        kind: openapi
        path: openapi.yaml
      auth:
        scheme: jwt
        idp: comp_identity_provider
      status: planned
      evidence: 'Human: ''Single REST API, no gateway'''
    - to: comp_identity_provider
      interaction: sync
      via: http
      auth:
        scheme: oidc
        idp: comp_identity_provider
      status: planned
      evidence: 'Human: ''Entra ID'' for sign-in'
    stack:
      choices:
        styling: tailwind
        language: typescript
        framework: react + vite
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: database not applicable — talks to data only through the Records API
  comp_records_api:
    name: Records API
    repo_ref: conn-github-32ebad80c69641869af2467b473acbcb
    kind: api_service
    directory: services/records-api
    integrations:
    - to: comp_relational_database
      interaction: sync
      via: postgresql
      status: planned
      evidence: 'Human: API ''validates and stores data''; database is persistent
        storage'
    - to: comp_identity_provider
      interaction: sync
      via: http
      auth:
        scheme: jwt
        idp: comp_identity_provider
      status: planned
      evidence: 'Human: API ''handles authentication and authorization''; Entra ID
        chosen'
    - to: external:email-provider
      interaction: sync
      via: http
      status: planned
      evidence: 'recommended default, accepted by the human without review: Amazon
        SES (on AWS)'
    stack:
      choices:
        database: postgresql
        language: typescript
        framework: fastify
        package_manager: pnpm
        testing_tool_e2e: playwright
        testing_tool_unit: vitest
      notes: styling not applicable — API only; e2e via Playwright API tests
  comp_relational_database:
    name: Relational Database
    repo_ref: conn-github-32ebad80c69641869af2467b473acbcb
    kind: managed_service
    stack:
      choices:
        managed_service: PostgreSQL on Amazon RDS (Multi-AZ)
  comp_identity_provider:
    name: Identity Provider
    repo_ref: conn-github-32ebad80c69641869af2467b473acbcb
    kind: managed_service
    identity:
      provider: entra
      hosting: managed
      protocols:
      - oidc
      - oauth2
      - jwt
      flows:
      - authorization_code_pkce
      token: jwt
      user_store: provider
      notes: Protocols and flow proposed (OIDC, auth code + PKCE for the browser app);
        not yet confirmed.
    stack:
      choices:
        managed_service: Microsoft Entra ID
