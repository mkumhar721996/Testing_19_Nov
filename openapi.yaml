# Generated by arc when Records API (comp_records_api) was scaffolded: a stub of the contract comp_web_app call. Fill it in; arc never overwrites it.
openapi: 3.0.3
info:
  title: Records API (comp_records_api)
  version: 0.1.0
components:
  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: payment_declined
            message:
              type: string
    Pricing:
      oneOf:
        - type: object
          required: [kind, priceMinor]
          properties:
            kind:
              type: string
              enum: [fixed]
            priceMinor:
              type: integer
        - type: object
          required: [kind, rateMinor, durationMinutes]
          properties:
            kind:
              type: string
              enum: [hourly]
            rateMinor:
              type: integer
            durationMinutes:
              type: integer
    Booking:
      type: object
      required: [id, serviceName, providerName, status, pricing, amountDueMinor, currency, payBy, cancelReason, cancelledAt]
      properties:
        id:
          type: string
        serviceName:
          type: string
        providerName:
          type: string
        status:
          type: string
          enum: [requested, confirmed_payment_due, paid, declined, expired, cancelled]
        pricing:
          $ref: '#/components/schemas/Pricing'
        amountDueMinor:
          type: integer
          description: Amount to charge in minor units, computed by the server
        currency:
          type: string
          example: USD
        payBy:
          type: string
          format: date-time
          nullable: true
        cancelReason:
          type: string
          enum: [payment_timeout]
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /bookings:
    get:
      summary: List the signed-in customer's bookings (overdue unpaid ones are cancelled first)
      responses:
        '200':
          description: The customer's bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Error'
  /bookings/{id}/confirm:
    post:
      summary: Provider confirms a requested booking; fixes the amount and starts the 24-hour payment window
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The confirmed booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /bookings/{id}/decline:
    post:
      summary: Provider declines a requested booking; no charge is made
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The declined booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /bookings/{id}/pay:
    post:
      summary: Customer pays a confirmed booking with an opaque payment token (never card details)
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentToken]
              additionalProperties: false
              properties:
                paymentToken:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Payment completed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [paid]
        '400':
          description: Body carries anything other than paymentToken
        '402':
          description: Payment declined or failed; the booking stays confirmed and payable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
