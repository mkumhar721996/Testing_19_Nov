# Generated by arc when Records API (comp_records_api) was scaffolded: a stub of the contract comp_web_app call. Fill it in; arc never overwrites it.
openapi: 3.0.3
info:
  title: Records API (comp_records_api)
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WatchlistTicker:
      type: object
      required: [symbol, createdAt]
      properties:
        symbol:
          type: string
          example: AAPL
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_symbol, duplicate_symbol]
            message:
              type: string
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /watchlist:
    get:
      summary: List the watchlist, oldest ticker first
      responses:
        '200':
          description: The tickers on the watchlist
          content:
            application/json:
              schema:
                type: object
                required: [tickers]
                properties:
                  tickers:
                    type: array
                    items:
                      $ref: '#/components/schemas/WatchlistTicker'
    post:
      summary: Add a ticker to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol:
                  type: string
                  example: AAPL
      responses:
        '201':
          description: The ticker was added (symbol is stored trimmed and uppercase)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistTicker'
        '400':
          description: The symbol is missing or not valid (1 to 5 letters, optional . or - and 1 to 2 letters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The symbol is already on the watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
